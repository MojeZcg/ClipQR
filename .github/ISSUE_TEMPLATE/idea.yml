name: Idea o tipo de QR nuevo / Idea or new QR type
description: "Una mejora, o un tipo de QR que ClipQR debería entender (factura, pago, documento de tu país…). · An improvement, or a QR type ClipQR should understand (an invoice, payment or ID document from your country…)."
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría? / What would you like?
    validations:
      required: true
  - type: textarea
    id: formato
    attributes:
      label: Si es un tipo de QR nuevo / If it's a new QR type
      description: >-
        País, organismo o empresa que lo usa, enlace a la especificación oficial si la hay, y un ejemplo con los
        datos personales borrados.
        · Country, agency or company that uses it, a link to the official specification if there is one, and a
        sample with the personal data removed.
