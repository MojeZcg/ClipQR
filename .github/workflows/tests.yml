name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Tk y xclip para la app; las cabeceras del kernel para compilar evdev (dependencia de pynput en Linux).
      # El mirror de Azure de los runners (azure.archive.ubuntu.com) a veces no resuelve: se usa el de Ubuntu.
      - name: Paquetes del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y python3-tk xclip linux-libc-dev
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Pyflakes
        run: python -m pyflakes clipqr main.py installer tools tests
      - name: Tests
        run: python -m pytest -q
